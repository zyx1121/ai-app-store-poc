name: Runtimes

# Native runtimes the store downloads on machines whose GPU WSL2 cannot see.
# whisper.cpp publishes no Vulkan build for Windows, so this job builds the
# server with GGML_VULKAN and publishes it, with a SHA256SUMS beside it, to a
# fresh `runtimes-vN` release; the `WHISPER_VULKAN` spec in services.rs points
# at one specific tag and `fetch::release_checksum` checks the zip against
# that release's SHA256SUMS (there is no compile-time digest to embed for a
# binary this workflow builds itself). Each tag is created once and never
# republished, so a compromised token or a bad workflow_dispatch input cannot
# silently swap the file every installed client already trusts (#37).

on:
  workflow_dispatch:
    inputs:
      whisper_ref:
        description: whisper.cpp tag or commit to build
        default: v1.9.3
  push:
    paths:
      - .github/workflows/runtimes.yml

permissions:
  contents: write

env:
  WHISPER_REF: ${{ inputs.whisper_ref || 'v1.9.3' }}
  VULKAN_VERSION: 1.4.357.0

jobs:
  whisper-vulkan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ env.WHISPER_REF }}
          path: whisper.cpp

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -L -o "$env:RUNNER_TEMP\VulkanSDK.exe" "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Build whisper-server with Vulkan
        shell: pwsh
        working-directory: whisper.cpp
        run: |
          cmake -B build -A x64 -DGGML_VULKAN=ON -DBUILD_SHARED_LIBS=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build --config Release --target whisper-server --parallel
          Get-ChildItem build\bin\Release

      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item whisper.cpp\build\bin\Release\*.exe, whisper.cpp\build\bin\Release\*.dll out\
          Copy-Item whisper.cpp\LICENSE out\LICENSE.whisper.cpp
          Set-Content out\SOURCE.txt "whisper.cpp ${env:WHISPER_REF}, built with GGML_VULKAN=ON (Vulkan SDK ${env:VULKAN_VERSION}) by ai-app-store-poc runtimes.yml"
          Compress-Archive -Path out\* -DestinationPath whisper-server-vulkan-x64.zip
          Get-Item whisper-server-vulkan-x64.zip | Select-Object Name, Length
          # sha256sum format (lowercase hex, two spaces, file name) so fetch.rs's
          # SHA256SUMS parser and any local `shasum -a 256 -c` both read it.
          $hash = (Get-FileHash whisper-server-vulkan-x64.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline SHA256SUMS "$hash  whisper-server-vulkan-x64.zip`n"
          Get-Content SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: whisper-server-vulkan-x64
          path: |
            whisper-server-vulkan-x64.zip
            SHA256SUMS

      # Each run cuts a new `runtimes-vN` tag rather than overwriting a rolling
      # one, so a compromised token or a bad workflow_dispatch input cannot
      # swap the file every client already trusts. WHISPER_VULKAN in
      # services.rs is pinned to one specific tag; bump it by hand after
      # checking a new release's SHA256SUMS.
      - name: Determine the next runtimes tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName -q '.[].tagName' \
            | grep -E '^runtimes-v[0-9]+$' | sed 's/runtimes-v//' | sort -n | tail -1)
          next=$(( ${latest:-0} + 1 ))
          echo "tag=runtimes-v$next" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Native runtimes (${{ steps.tag.outputs.tag }})" \
            --notes "whisper.cpp ${{ env.WHISPER_REF }} built with GGML_VULKAN=ON. See .github/workflows/runtimes.yml." \
            whisper-server-vulkan-x64.zip SHA256SUMS
